services:
  - type: web
    name: taskmaster-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: WEATHER_API_BASE
        value: https://api.weatherapi.com/v1
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret
      - key: MONGODB_URI
        sync: false # paste your Atlas connection string
      - key: WEATHER_API_KEY
        sync: false # paste your WeatherAPI.com key
      - key: CLIENT_ORIGIN
        sync: false # your Vercel URL, e.g. https://taskmaster.vercel.app
